name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Flutter client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: dukan_core (pure Dart) — analyze + test + no-flutter check
        working-directory: packages/dukan_core
        run: |
          dart pub get
          dart analyze
          dart test
          # A dependency named flutter, not the "Flutter SDK" banner pub prints.
          deps="$(dart pub deps --style=compact)"
          grep -q '^dukan_core ' <<<"$deps"
          if grep -qE '^- flutter( |$)' <<<"$deps"; then
            echo "flutter leaked into dukan_core"; exit 1
          fi
      - name: dukan_data (Drift codegen) + sync + hardware
        run: |
          (cd packages/dukan_data && dart pub get && dart run build_runner build && dart analyze && dart test)
          for p in dukan_sync dukan_hardware; do
            (cd "packages/$p" && dart pub get && dart analyze)
          done
      - name: App — analyze + test
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze
          flutter test
      - name: l10n parity
        run: python3 tools/check_l10n_parity.py

  server:
    name: FastAPI server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint + types + architecture contracts + tests
        working-directory: server
        run: |
          ruff check .
          mypy dukan
          lint-imports
          pytest -q

  server-postgres:
    name: FastAPI server on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dukan
          POSTGRES_PASSWORD: dukan
          POSTGRES_DB: dukan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dukan" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # The fixtures build every test's schema with `alembic upgrade head`, and
      # the migration tests walk, check and downgrade the revisions, on PostgreSQL.
      DUKAN_TEST_DATABASE_URL: postgresql+psycopg://dukan:dukan@localhost:5432/dukan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Migrations + integration suite
        working-directory: server
        run: pytest -q

  server-image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t dukanpro-server server
      - name: It migrates, starts and answers /health
        run: |
          key=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')
          docker run -d --name api -p 8000:8000 -e DUKAN_SECRET_KEY="$key" \
            -e DUKAN_DATABASE_URL=sqlite:////tmp/dukan.db dukanpro-server
          # The port answers before the server inside does (a reset connection):
          # ask again for up to a minute, then show what the container said.
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1
