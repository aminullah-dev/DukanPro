[project]
name = "dukanpro-server"
version = "0.1.0"
description = "DukanPro FastAPI backend (authoritative). Clean Architecture."
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings>=2",
  "sqlalchemy>=2",
  "alembic",
  "argon2-cffi>=23",
  "pyjwt>=2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3"]
dev = ["pytest", "httpx", "ruff", "mypy", "import-linter"]

# Only the application is a package. migrations/ is Alembic's script folder, read
# by path; without this, setuptools finds two top-level packages and refuses
# to build (`pip install -e .` fails in CI).
[tool.setuptools.packages.find]
include = ["dukan*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
