[project]
name = "dukanpro-server"
version = "0.1.0"
description = "DukanPro FastAPI backend (authoritative). Clean Architecture."
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings>=2",
  "sqlalchemy>=2",
  "alembic",
  "argon2-cffi>=23",
  "pyjwt>=2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3"]
dev = ["pytest", "httpx", "ruff", "mypy", "import-linter"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
