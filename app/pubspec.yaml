name: dukanpro
description: "DukanPro — offline-first cross-platform retail POS (Flutter client)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: any

  # DukanPro packages (dependencies point inward: app → sync/data/hardware → core)
  dukan_core:
    path: ../packages/dukan_core
  dukan_data:
    path: ../packages/dukan_data
  dukan_sync:
    path: ../packages/dukan_sync
  dukan_hardware:
    path: ../packages/dukan_hardware
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  flutter_secure_storage: ^11.1.0
  dio: ^5.11.1
  cryptography: ^2.9.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  drift: ^2.35.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true   # generate AppLocalizations from lib/l10n/*.arb (see l10n.yaml)

  # Perso-Arabic font with full Pashto glyph coverage is bundled in Phase 1.
  # A license-clean Naskh face (e.g. Noto Naskh Arabic / Vazirmatn) will be
  # dropped into app/fonts/ and declared here; until then the OS Perso-Arabic
  # font is used. See docs/localization.md.
  # fonts:
  #   - family: DukanNaskh
  #     fonts:
  #       - asset: fonts/NotoNaskhArabic-Regular.ttf
  #       - asset: fonts/NotoNaskhArabic-Bold.ttf
  #         weight: 700
