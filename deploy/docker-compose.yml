# DukanPro in production: PostgreSQL, the API, HTTPS in front of it (Caddy)
# and a daily backup. Fill in .env (from .env.example), then:
#   docker compose up -d --build
# See docs/deploy.md.
name: dukanpro

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dukan
      POSTGRES_DB: dukan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukan -d dukan"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ../server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # DUKAN_SECRET_KEY and, if set, DUKAN_BOOTSTRAP_TOKEN come from .env.
    env_file: .env
    environment:
      DUKAN_DATABASE_URL: postgresql+psycopg://dukan:${POSTGRES_PASSWORD}@db:5432/dukan
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DUKAN_DOMAIN: ${DUKAN_DOMAIN:?set DUKAN_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: dukan
      PGDATABASE: dukan
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    # Once a day: a compressed dump, written whole before it gets its name, and
    # dumps older than KEEP_DAYS removed.
    command:
      - |
        while true; do
          file=/backups/dukan-$$(date -u +%Y%m%dT%H%MZ).sql.gz
          pg_dump --no-owner | gzip > "$$file.part" && mv "$$file.part" "$$file"
          find /backups -name 'dukan-*.sql.gz' -mtime +"$$KEEP_DAYS" -delete
          sleep 86400
        done

volumes:
  db:
  caddy_data:
  caddy_config:
